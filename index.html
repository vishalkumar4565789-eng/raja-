<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>playboymeeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #030708;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Neon Border Container */
        .container {
            width: 100%;
            max-width: 400px;
            background: #000000;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 15px #00ffcc, inset 0 0 15px #00ffcc;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            position: relative;
            z-index: 10;
            margin: 10px;
        }

        /* Profile Image with Glowing Circle */
        .profile-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px #00f0ff;
            overflow: hidden;
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text Styling */
        h2 {
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff007f;
            color: #fff;
            padding: 4px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            box-shadow: 0 0 8px #ff007f;
        }

        /* Join Button */
        .join-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #b000ff, #00d4ff);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            border-radius: 30px;
            box-shadow: 0 0 15px #00d4ff;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .join-btn:hover {
            transform: scale(1.02);
        }

        /* Countdown Circle */
        .timer-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            font-size: 28px;
            font-weight: bold;
        }

        .auto-join-text {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff007f;
            border-radius: 15px;
            padding: 6px 12px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 10px #ff007f;
        }

        /* Info Boxes */
        .info-box {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Image -->
        <div class="profile-container">
            <!-- Apni image ka URL yahan badlein -->
            <img src="" alt="Profile">
        </div>

        <h2>playboymeeting</h2>
        <div class="badge">Real service 🔥</div>

        <!-- Telegram Button (Apna link yahan dalein) -->
        <a href="https://t.me/+zp3pcjhCRQVjOGE1" id=" class="join-btn">JOIN TELEGRAM</a>

        <!-- Countdown Timer -->
        <div class="timer-circle" id="countdown">5</div>

        <div class="auto-join-text">
            Auto joining in <span id="auto-seconds">52</span> seconds...
        </div>

        <!-- Buttons / Features List -->
        <div class="info-box">💥</div>
        <div class="info-box">🔥 Money RefunD</div>
        <div class="info-box">⚡ 24/7 Support</div>
        <div class="info-box">🚀</div>
    </div>

    <script>
        // Telegram Link Setup
        const telegramURL = "https://t.me/your_telegram_link"; // Aapka Telegram Link

        // Main Timer Logic (5 Seconds)
        let count = 5;
        const timerElement = document.getElementById('countdown');

        const countdownInterval = setInterval(() => {
            count--;
            if (count >= 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdownInterval);
                window.location.href = telegramURL; // Timer end hote hi redirect
            }
        }, 1000);

        // Auto Join Secondary Timer Logic (52 Seconds)
        let autoCount = 52;
        const autoSecondsElement = document.getElementById('auto-seconds');

        setInterval(() => {
            if (autoCount > 0) {
                autoCount--;
                autoSecondsElement.innerText = autoCount;
            }
        }, 1000);
    </script>
</body>
</html>
